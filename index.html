<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEDM カルタ</title>
    <link rel="stylesheet" href="style.css?v=20261031-all-rankings" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hero" aria-label="SEDMカルタ"><img src="assets/header.png?v=20261022" alt="浮世絵風 Summer EDM かるた" /></section>

      <section id="setup-screen" class="setup-screen" aria-labelledby="setup-title">
        <p class="eyebrow">Game Setup</p>
        <h1 id="setup-title">あそびかたを選ぼう</h1>
        <button id="bgm-toggle-button" class="bgm-switch" type="button" role="switch" aria-checked="true" aria-label="BGM"><span>BGM</span><span class="switch-track" aria-hidden="true"></span><span id="bgm-state">ON</span></button>
        <button id="home-ranking-button" class="secondary-button" type="button">ランキングを見る</button>
        <button id="home-join-button" class="secondary-button" type="button">ルームコードでオンライン対戦に参加</button>
        <section class="setup-step" data-step="1">
          <h2>1. モードを選択</h2>
          <div class="choice-grid">
            <button class="choice-button is-selected" data-setting="playMode" data-value="virtual" type="button"><strong>ヴァーチャルカルタモード</strong><span>ブラウザ上の札を取って遊ぶ</span></button>
            <button class="choice-button" data-setting="playMode" data-value="physical" type="button"><strong>現実カルタモード</strong><span>音声だけを再生する※実際の札を持つ方限定</span></button>
          </div>
          <button class="primary-button step-next" type="button">つぎへ</button>
        </section>
        <section class="setup-step" data-step="2" hidden>
          <h2>2. 難易度を選択</h2>
          <div class="choice-grid">
            <button class="choice-button" data-setting="difficulty" data-value="karuta" type="button"><strong>初級：カルタモード</strong><span>すべての札を使ったカルタ</span></button>
            <button class="choice-button is-selected" data-setting="difficulty" data-value="hyakunin" type="button"><strong>上級：百人一首モード</strong><span>上の句を聞き下の句の札を取る</span></button>
          </div>
          <div class="step-actions"><button class="text-button step-back" type="button">もどる</button><button class="primary-button step-next" type="button">つぎへ</button></div>
        </section>
        <section class="setup-step" data-step="3" hidden>
          <h2>3. 音声を選択</h2>
          <div class="choice-grid">
            <button class="choice-button" data-setting="audioStyle" data-value="source" type="button"><strong>音源モード</strong><span>実際の曲を再生</span></button>
            <button class="choice-button is-selected" data-setting="audioStyle" data-value="recitation" type="button"><strong>詠みあげモード</strong><span>百人一首のような詠みあげ音声を再生</span></button>
          </div>
          <div class="step-actions"><button class="text-button step-back" type="button">もどる</button><button class="primary-button step-next" type="button">つぎへ</button></div>
        </section>
        <section class="setup-step" data-step="4" hidden>
          <h2>4. 対戦形式を選択</h2>
          <div class="choice-grid">
            <button class="choice-button is-selected" data-setting="matchType" data-value="solo" type="button"><strong>タイムトライアル</strong><span>制限時間内に札を取りまくって高得点を目指せ！</span></button>
            <button class="choice-button" data-setting="matchType" data-value="online" type="button"><strong>オンライン対戦</strong><span>固定コード SEDM01 で2〜10人の対戦をする</span></button>
          </div>
          <div class="step-actions"><button class="text-button step-back" type="button">もどる</button><button class="primary-button step-next" type="button">つぎへ</button></div>
        </section>
        <section class="setup-step" data-step="5" hidden>
          <h2>5. 設定を確認</h2>
          <dl id="setting-summary" class="setting-summary"></dl>
          <div class="step-actions"><button class="text-button step-back" type="button">もどる</button><button id="start-button" class="primary-button" type="button">ゲームを始める</button></div>
        </section>
      </section>

      <section id="game-screen" hidden>
        <section class="dashboard" aria-label="ゲーム状況">
          <div class="status-item"><span>問題</span><strong id="round">0 / 37</strong></div>
          <div id="remaining-status" class="status-item" hidden><span>残り札</span><strong id="remaining">0</strong></div>
          <div id="taken-status" class="status-item" hidden><span>自分の取得札</span><strong id="taken">0</strong></div>
          <div id="score-status" class="status-item"><span>ポイント</span><strong id="score">0</strong></div>
          <div id="timer-status" class="status-item timer"><span>経過時間</span><strong id="timer">--</strong></div>
          <button id="replay-button" class="secondary-button" type="button" disabled>もう一度聞く</button>
          <button id="next-button" class="secondary-button" type="button" disabled hidden>次の句へ</button>
          <button id="end-button" class="secondary-button end-button" type="button" disabled>途中で終了</button>
          <div id="board-size-control" class="board-size-control" aria-label="札サイズ">
            <span>札サイズ</span>
            <button data-board-size="medium" type="button">中</button>
            <button class="is-selected" data-board-size="small" type="button">小</button>
            <button data-board-size="large" type="button">大</button>
          </div>
        </section>
        <section class="message-panel" aria-live="polite"><p id="message"></p></section>
        <section id="online-players" class="online-players" aria-label="参加者の取得枚数" hidden></section>
        <div id="game-voice"></div>
        <section id="card-board" class="card-board" aria-label="カルタ札"></section>
      </section>
    </main>
    <dialog id="result-dialog" class="result-dialog">
      <div><p class="eyebrow">Game Complete</p><h2 id="result-title">ゲーム終了！</h2><p id="result-label">合計ポイント</p><strong id="final-score">0</strong><p id="result-message"></p><ol id="result-ranking" hidden></ol><div id="result-voice"></div><button id="restart-button" class="primary-button" type="button">設定画面へ</button></div>
    </dialog>
    <dialog id="room-dialog" class="result-dialog room-dialog">
      <div>
        <p class="eyebrow">Online Match</p>
        <h2>オンライン対戦</h2>
        <div id="room-entry">
          <label id="player-name-label" class="room-label">表示名<input id="player-name" maxlength="12" value="プレイヤー" /></label>
          <button id="create-room-button" class="primary-button" type="button">ルームを作る</button>
          <label id="room-code-label" class="room-label">ルームコード<input id="room-code-input" maxlength="6" placeholder="例：AB12CD" /></label>
          <button id="join-room-button" class="secondary-button" type="button">ルームに参加</button>
        </div>
        <div id="room-waiting" hidden>
          <p>ルームコード</p><strong id="room-code-display">------</strong>
          <p id="room-player-list"></p>
          <div id="waiting-voice"></div>
          <button id="room-start-button" class="primary-button" type="button" disabled>対戦を始める</button>
        </div>
        <p id="room-message"></p>
        <button id="room-back-button" class="text-button" type="button">戻る</button>
      </div>
    </dialog>
    <dialog id="trial-ranking-dialog" class="result-dialog">
      <div>
        <p class="eyebrow">Time Trial Ranking</p><h2>ランキング TOP 5</h2>
        <p id="trial-ranking-category"></p>
        <form id="trial-ranking-form" hidden>
          <p>5位以内にランクイン！ 名前を登録してください。</p>
          <label class="room-label">名前<input id="trial-ranking-name" maxlength="12" required /></label>
          <button class="primary-button" type="submit">登録する</button>
        </form>
        <ol id="trial-ranking-list"></ol>
        <p id="trial-ranking-message" role="status"></p>
        <button id="trial-ranking-back" class="secondary-button" type="button">設定画面へ</button>
      </div>
    </dialog>
    <audio id="reader" preload="auto"></audio>
    <script type="module" src="script.js?v=20261031-all-rankings"></script>
  </body>
</html>
